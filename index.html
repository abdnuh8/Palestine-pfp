
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palestine PFP Maker</title>
  <link href="style.css" rel="stylesheet" />
</head>
<body class="bg-white text-center p-4 font-sans">
  <h1 class="text-3xl font-bold my-4">Show Solidarity <span class="text-lg">🇵🇸</span></h1>
  <p class="mb-4">Upload your photo and get a Palestine-themed profile picture</p>
  
  <input type="file" accept="image/*" id="upload" class="mb-4" />
  <div class="preview-wrapper">
    <canvas id="canvas" width="400" height="400"></canvas>
  </div>
  <button id="download" class="mt-4 bg-black text-white px-4 py-2 rounded">Download Image</button>

  <script src="script.js"></script>
</body>
</html>
