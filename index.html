<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palestine Profile Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🇵🇸 Show Solidarity</h1>
        <p>Let's unite in our profile pictures to spotlight the cause</p>
        
        <div class="editor">
            <input type="file" id="upload" accept="image/*" hidden>
            <label for="upload" class="upload-btn">Choose Photo</label>
            
            <div class="preview-container">
                <canvas id="canvas"></canvas>
                <img src="overlay.png" id="overlay" alt="palestine overlay">
            </div>
            
            <button id="download" class="download-btn">Download Image</button>
        </div>
        
        <p class="footer">Hosted with ❤️ on GitHub Pages</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
